name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts matches how deps are installed locally (supply-chain hygiene):
      # the @tetherto / @solana deps have no build step we need to run.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # The e2e suite auto-skips when no Surfpool RPC answers on 127.0.0.1:8899
      # (reachability gate in tests/e2e/surfpool.e2e.test.js), so CI needs no validator.
      - run: npm test
      # Guard the PUBLISHED declaration surface: build types/, then compile a strict
      # downstream consumer (typecheck/) against them. Regression guard for the
      # abstract-override that tsc's declaration emit silently drops (TS2654).
      - run: npm run build:types
      - run: npx tsc -p typecheck/tsconfig.json
      # Non-blocking: the module deliberately depends on first-party @tetherto/...@beta
      # packages, and a transitive beta advisory must not red the build. Surfaced, not gating.
      - run: npm audit --omit=dev
        continue-on-error: true

  bare:
    runs-on: ubuntu-latest
    name: Bare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `bare` ships as a devDependency, so npm ci installs the runtime to node_modules/.bin
      # — `npm run` puts it on PATH for brittle-bare. --ignore-scripts matches the Node job.
      - run: npm ci --ignore-scripts
      # Runtime portability proof: the pure-logic test files (instruction mapping + v0
      # message build, exercising the @solana primitives) run unchanged on Bare. The
      # fetch/wallet-driven files stay Node-only (they need node: builtins + WDK crypto).
      - run: npm run test:bare
